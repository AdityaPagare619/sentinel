<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — SRE decision instrument</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/rebuild.css">
</head>
<body>
<div id="mock-banner" class="mock-banner" hidden></div>
<header id="topbar" class="topbar">
  <div class="brand">SENTINEL</div>
  <nav id="nav" class="nav" aria-label="screens"></nav>
  <div class="topbar-right">
    <span id="src-badge" class="src-badge" data-src="">◈ …</span>
    <span id="ds-version" class="ds-version mono">ds:—</span>
    <span id="sse-state" class="sse-state mono" title="stream connection state">○ paused</span>
    <button id="palette-btn" class="palette-btn mono" title="command palette (Ctrl+K)">⌘K</button>
  </div>
</header>
<div id="strip" class="strip" role="status" aria-live="polite"></div>
<main id="view" class="view"></main>
<aside id="drawer" class="drawer" hidden aria-label="decision detail"></aside>
<div id="palette" class="palette" hidden>
  <input id="palette-input" class="palette-input mono" placeholder="team=payments · fpr=… · reason=triple-lock · screen:river" autocomplete="off" spellcheck="false">
  <div id="palette-list" class="palette-list"></div>
</div>
<div id="palette-hint" class="palette-hint mono" hidden></div>
<script src="assets/config.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
