<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Sentinel runs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>Where Sentinel runs</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sentinel-deploy-title sentinel-deploy-desc">
        <title id="sentinel-deploy-title">Sentinel deployment topology</title>
        <desc id="sentinel-deploy-desc">Where Sentinel runs: the dev laptop, GitHub Pages static consoles, the Vercel serverless platform API called cross-origin by the operator browser, and the customer-hosted receiver pipeline paging PagerDuty, with the promotion path and secret placement.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONES (first) ============ -->
        <rect x="40" y="96" width="300" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="48" y="100" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="88" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL DEV</text>

        <rect x="380" y="96" width="300" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="388" y="100" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="438" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB PAGES</text>

        <rect x="720" y="96" width="440" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="728" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PRODUCTION</text>

        <!-- ============ NETWORK PATHS ============ -->
        <!-- P1 laptop -> pages -->
        <line x1="300" y1="230" x2="420" y2="230" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="328" y="210" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="219" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>
        <!-- P2 laptop -> vercel -->
        <path d="M 300,140 H 832 Q 840,140 840,148 V 170" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="538" y="120" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>
        <!-- P3 browser -> pages -->
        <path d="M 190,600 V 568 H 522 Q 530,568 530,560 V 380" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="458" y="464" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="473" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>
        <!-- P4 browser -> vercel (the seam) -->
        <path d="M 300,644 H 832 Q 840,644 840,636 V 340" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="538" y="624" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="633" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>
        <!-- P5 pipeline -> pagerduty (in-zone, muted) -->
        <line x1="1050" y1="320" x2="1050" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1058" y="354" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1090" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <!-- ============ MARGIN NOTES ============ -->
        <text x="40" y="716" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Promotion path: local &#8594; staging &#8594; loadtest &#8594; production · one console codebase.</text>
        <text x="40" y="738" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Secrets: Jev key in a Vercel env var · operator token session-only · never in browser JS, files, or logs.</text>

        <!-- ============ NODES ============ -->
        <!-- N1 Dev laptop -->
        <rect x="80" y="170" width="220" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="170" width="220" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="176" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="102" y="185" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="190" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dev laptop</text>
        <text x="190" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console · api :8000</text>
        <text x="190" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pipeline · FakePD sink</text>

        <!-- N2 Pages CDN -->
        <rect x="420" y="170" width="220" height="210" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="170" width="220" height="210" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="428" y="176" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="442" y="185" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
        <text x="530" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Pages</text>
        <text x="530" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">static consoles</text>
        <rect x="432" y="246" width="196" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="442" y="262" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">/ — production</text>
        <text x="618" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2eee058</text>
        <rect x="432" y="278" width="196" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="442" y="294" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">/staging/ — sim</text>
        <text x="618" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2eee058</text>
        <rect x="432" y="310" width="196" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="442" y="326" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">/loadtest/ — dash</text>
        <text x="618" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2eee058</text>

        <!-- N3 Vercel API (FOCAL) -->
        <rect x="760" y="170" width="190" height="170" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="170" width="190" height="170" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="768" y="176" width="32" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="784" y="185" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAAS</text>
        <text x="855" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">platform API</text>
        <text x="855" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sentinel-platform</text>
        <rect x="772" y="246" width="166" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="782" y="262" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">api bundle</text>
        <text x="928" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">dpl_7erEzK2C</text>
        <text x="855" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kill: per-instance /tmp</text>
        <text x="855" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no forwarder on tier</text>

        <!-- N4 Customer pipeline -->
        <rect x="975" y="170" width="150" height="150" rx="6" fill="#f5f5f5"/>
        <rect x="975" y="170" width="150" height="150" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="983" y="176" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="997" y="185" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="1050" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver pipeline</text>
        <text x="1050" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">real flows · BYOK</text>
        <rect x="987" y="246" width="126" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="997" y="262" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">pipeline</text>
        <text x="1103" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">9f51807</text>

        <!-- N5 PagerDuty (external) -->
        <rect x="975" y="400" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="975" y="400" width="150" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="983" y="406" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="999" y="415" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAAS</text>
        <text x="1050" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PagerDuty</text>
        <text x="1050" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">real · BYOK only</text>

        <!-- N6 Operator browser -->
        <rect x="80" y="600" width="220" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="600" width="220" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="88" y="606" width="44" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="110" y="615" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="190" y="648" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator browser</text>
        <text x="190" y="664" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">token: session-only</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="762" x2="1160" y2="762" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
          <rect x="40" y="776" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="60" y="784">SERVICE</text>
          <rect x="140" y="776" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
          <text x="160" y="784">FOCAL</text>
          <rect x="220" y="776" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="240" y="784">EXTERNAL</text>
          <line x1="340" y1="781" x2="370" y2="781" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <text x="378" y="784">HTTPS X-BOUNDARY</text>
          <line x1="520" y1="781" x2="550" y2="781" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="558" y="784">IN-ZONE</text>
          <rect x="650" y="776" width="40" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="698" y="784">ARTIFACT + VER</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
