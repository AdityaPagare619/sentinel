<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One alert, from webhook to page</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>One alert, from webhook to page</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sentinel-sequence-title sentinel-sequence-desc">
        <title id="sentinel-sequence-title">Alert to page: race, gate, halt</title>
        <desc id="sentinel-sequence-desc">Time-ordered messages as one alert travels from its source through the Jev-versus-timer race and the deterministic gate to PagerDuty, showing the fail-open timeout branch and the kill-switch halt path.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ LIFELINES ============ -->
        <line x1="120" y1="160" x2="120" y2="770" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="360" y1="160" x2="360" y2="770" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="600" y1="160" x2="600" y2="770" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="160" x2="840" y2="770" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1080" y1="160" x2="1080" y2="770" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ ACTIVATION BARS ============ -->
        <rect x="356" y="200" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="596" y="248" width="8" height="248" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="836" y="400" width="8" height="252" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1076" y="608" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ FRAGMENTS ============ -->
        <!-- ALT: Jev judgment vs timer win -->
        <rect x="548" y="344" width="344" height="152" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="548" y="344" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="568" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="560" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[Jev judgment in time]</text>
        <line x1="556" y1="424" x2="884" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="560" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[timer wins · fail-open]</text>
        <!-- OPT: kill engaged -->
        <rect x="1028" y="668" width="104" height="88" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="1028" y="668" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="1048" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="1040" y="700" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[kill engaged]</text>

        <!-- ============ MESSAGES ============ -->
        <!-- M1 alert -->
        <line x1="120" y1="200" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="218" y="180" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERT</text>
        <!-- M2 start race -->
        <line x1="360" y1="248" x2="600" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="449" y="228" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START RACE</text>
        <!-- M3 timer self -->
        <path d="M 600,296 H 620 Q 628,296 628,304 V 312 Q 628,320 620,320 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="636" y="302" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="311" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIMER 2.7S</text>
        <!-- M4 advisory (alt region 1) -->
        <line x1="600" y1="400" x2="840" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="689" y="380" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADVISORY</text>
        <!-- M5 timeout (alt region 2) -->
        <line x1="600" y1="472" x2="840" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="693" y="452" width="54" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT</text>
        <!-- M6 decide self -->
        <path d="M 840,540 H 860 Q 868,540 868,548 V 556 Q 868,564 860,564 H 840" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="876" y="546" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="902" y="555" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECIDE</text>
        <!-- M7 page (headline, accent) -->
        <line x1="840" y1="608" x2="1080" y2="608" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="943" y="588" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="965" y="597" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAGE</text>
        <!-- M8 delivered (return, dashed) -->
        <line x1="1080" y1="652" x2="840" y2="652" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="939" y="632" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="970" y="641" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVERED</text>
        <!-- M9 halt self (opt) -->
        <path d="M 1080,728 H 1100 Q 1108,728 1108,736 V 744 Q 1108,752 1100,752 H 1080" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1116" y="734" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1136" y="743" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HALT</text>

        <!-- ============ CALLOUT ============ -->
        <text x="1180" y="40" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Kill switch: 9.75ms flip-to-halt,</text>
        <text x="1180" y="58" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">measured on the receiver topology.</text>
        <path d="M 1120 160 V 668" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1120" cy="668" r="2" fill="#2d3142"/>

        <!-- ============ ACTORS ============ -->
        <!-- A Alert source -->
        <rect x="20" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="80" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="28" y="86" width="28" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="42" y="95" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="120" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alert source</text>
        <text x="120" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook · metrics</text>
        <!-- B Receiver -->
        <rect x="260" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="86" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="282" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="360" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver</text>
        <text x="360" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingest · correlate</text>
        <!-- C Race -->
        <rect x="500" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="508" y="86" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="522" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="600" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Race</text>
        <text x="600" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jev vs 2.7s timer</text>
        <!-- D Gate (focal) -->
        <rect x="740" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="80" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="748" y="86" width="32" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="764" y="95" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="840" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate</text>
        <text x="840" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic</text>
        <!-- E Forwarder -> PagerDuty -->
        <rect x="980" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="980" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="988" y="86" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="1002" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="1080" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Forwarder &#8594; PagerDuty</text>
        <text x="1080" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">durable outbox</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="800" x2="1160" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
          <line x1="40" y1="824" x2="70" y2="824" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="78" y="827">SYNC CALL</text>
          <line x1="180" y1="824" x2="210" y2="824" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
          <text x="218" y="827">RETURN</text>
          <line x1="300" y1="824" x2="330" y2="824" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="338" y="827">HEADLINE</text>
          <rect x="440" y="818" width="30" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
          <text x="478" y="827">FRAGMENT</text>
          <rect x="580" y="818" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="596" y="827">ACTIVE</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
