<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel: the page-or-suppress pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Sentinel: the page-or-suppress pipeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sentinel-pipeline-title sentinel-pipeline-desc">
        <title id="sentinel-pipeline-title">Sentinel page-or-suppress pipeline</title>
        <desc id="sentinel-pipeline-desc">Alert sources flow through receiver, correlator, a Jev-vs-timer race, and a deterministic gate that owns every page-or-suppress decision, then a forwarder to PagerDuty, with a fail-closed kill switch halting the forwarder.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ARROWS (drawn before boxes) ============ -->
        <!-- A1 sources -> receiver -->
        <line x1="190" y1="324" x2="222" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="184" y="304" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="206" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS</text>
        <!-- A2 receiver -> correlator -->
        <line x1="372" y1="324" x2="404" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="304" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GROUP</text>
        <!-- A3 correlator -> race -->
        <line x1="554" y1="324" x2="586" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="544" y="304" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBLEM</text>
        <!-- A4 race -> gate -->
        <line x1="736" y1="324" x2="768" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="726" y="304" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="752" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>
        <!-- A5 gate -> forwarder -->
        <line x1="918" y1="324" x2="950" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="916" y="304" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="934" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAGE</text>
        <!-- A6 forwarder -> pagerduty -->
        <line x1="1025" y1="368" x2="1025" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1033" y="413" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1061" y="422" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER</text>
        <!-- A7 kill -> forwarder : HALT (accent) -->
        <line x1="1025" y1="178" x2="1025" y2="280" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="1033" y="223" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1052" y="232" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HALT</text>
        <!-- A8 policy -> gate : SIGNED (up) -->
        <line x1="831" y1="470" x2="831" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="768" y="413" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="796" y="422" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED</text>
        <!-- A9 gate -> audit : LOG (dashed, down) -->
        <line x1="855" y1="368" x2="855" y2="470" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="864" y="413" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="882" y="422" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>

        <!-- ============ CALLOUTS ============ -->
        <text x="560" y="28" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">The deterministic gate owns every</text>
        <text x="560" y="46" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">page-or-suppress decision; Jev advises only.</text>
        <path d="M 470 54 Q 640 140 843 280" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="843" cy="280" r="2" fill="#2d3142"/>

        <text x="1160" y="28" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Kill switch is fail-closed:</text>
        <text x="1160" y="46" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">engaged &#8594; forwarder halts · 9.75ms measured.</text>
        <path d="M 1090 54 Q 1060 70 1025 90" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1025" cy="90" r="2" fill="#2d3142"/>

        <!-- ============ NODES ============ -->
        <!-- 1 Alert sources (input) -->
        <rect x="40" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="280" width="150" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="286" width="24" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="60" y="295" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="115" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alert sources</text>
        <text x="115" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhooks · metrics</text>

        <!-- 2 Receiver (backend) -->
        <rect x="222" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="222" y="280" width="150" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="230" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="244" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="297" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver</text>
        <text x="297" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingest · validate</text>

        <!-- 3 Correlator (backend) -->
        <rect x="404" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="404" y="280" width="150" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="412" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="426" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="479" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Correlator</text>
        <text x="479" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">group &#8594; problems</text>

        <!-- 4 Race (backend) -->
        <rect x="586" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="586" y="280" width="150" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="594" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="608" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="661" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Race</text>
        <text x="661" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jev vs 2.7s timer</text>

        <!-- 5 Gate (FOCAL) -->
        <rect x="768" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="280" width="150" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="776" y="286" width="32" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="792" y="295" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="843" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate</text>
        <text x="843" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">owns every decision</text>

        <!-- 6 Forwarder (backend) -->
        <rect x="950" y="280" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="950" y="280" width="150" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="958" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="972" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="1025" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Forwarder</text>
        <text x="1025" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">durable outbox</text>

        <!-- 7 PagerDuty (external) -->
        <rect x="950" y="470" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="950" y="470" width="150" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="958" y="476" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="974" y="485" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAAS</text>
        <text x="1025" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PagerDuty</text>
        <text x="1025" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FakePD sim · BYOK prod</text>

        <!-- 8 Kill switch (security) -->
        <rect x="950" y="90" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="950" y="90" width="150" height="88" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="958" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="974" y="105" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAFE</text>
        <text x="1025" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kill switch</text>
        <text x="1025" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fail-closed · 9.75ms</text>

        <!-- 9 Policy + audit log (store) -->
        <rect x="768" y="470" width="150" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="470" width="150" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="776" y="476" width="36" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="794" y="485" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="843" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Policy + audit</text>
        <text x="843" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signed · append-only</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="612" x2="1160" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
          <rect x="40" y="626" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
          <text x="60" y="634">INPUT</text>
          <rect x="120" y="626" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="140" y="634">SERVICE</text>
          <rect x="220" y="626" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
          <text x="240" y="634">FOCAL</text>
          <rect x="300" y="626" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="320" y="634">EXTERNAL</text>
          <rect x="410" y="626" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="4,3"/>
          <text x="430" y="634">SAFETY</text>
          <rect x="500" y="626" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="520" y="634">STORE</text>
          <line x1="590" y1="631" x2="620" y2="631" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="628" y="634">HALT PATH</text>
          <line x1="730" y1="631" x2="760" y2="631" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
          <text x="768" y="634">ASYNC / LOG</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
