<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — SRE decision instrument</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="modebar" class="modebar" role="status"></div>
<header id="topbar" class="topbar">
  <div class="brand">SENTINEL</div>
  <nav id="nav" class="nav" aria-label="screens"></nav>
  <div class="topbar-right">
    <button id="kill-chip" class="kill-chip" title="kill switch state — opens the KILL console"></button>
    <span id="health-chip" class="health-chip mono" title="pipeline health"></span>
    <button id="theme-btn" class="icon-btn" title="toggle theme">◐</button>
    <button id="palette-btn" class="icon-btn mono" title="command palette (Ctrl+K)">⌘K</button>
  </div>
</header>
<section id="pipeline" class="pipeline" aria-label="live pipeline"></section>
<main id="view" class="view"></main>
<aside id="drawer" class="drawer" hidden aria-label="detail"></aside>
<div id="palette" class="palette" hidden>
  <input id="palette-input" class="palette-input mono" placeholder="screen:proofs · page:ack · kill" autocomplete="off" spellcheck="false">
  <div id="palette-list" class="palette-list"></div>
</div>
<script src="assets/config.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
